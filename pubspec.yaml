name: kappogy_music_os_pro
description: Kappogy Music OS Pro fully offline tactile skeuomorphic music OS by Kappogy Ohms
publish_to: 'none'
version: 2.4.0+240

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio & Media
  just_audio: ^0.9.46
  audio_service: ^0.18.18
  audio_video_progress_bar: ^2.0.3

  # Architecture & State Management
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Local Database & Storage (100% Offline)
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4+4
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.2

  # Filesystem & Device
  file_picker: ^8.1.7
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # UI, Charts & Motion
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - assets/icons/
